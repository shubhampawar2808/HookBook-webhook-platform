# HookForge local development stack
# Ports: frontend 5173 | backend 8000 | postgres 5432 | redis 6379
# PostgreSQL and Redis are bound to localhost only (not publicly exposed).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hookforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookforge}
      POSTGRES_DB: ${POSTGRES_DB:-hookforge}
    volumes:
      - hookforge_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hookforge} -d ${POSTGRES_DB:-hookforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hookforge

  redis:
    image: redis:7-alpine
    container_name: hookforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - hookforge_redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - hookforge

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hookforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookforge}:${POSTGRES_PASSWORD:-hookforge}@postgres:5432/${POSTGRES_DB:-hookforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - hookforge
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hookforge-celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookforge}:${POSTGRES_PASSWORD:-hookforge}@postgres:5432/${POSTGRES_DB:-hookforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hookforge
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hookforge-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hookforge}:${POSTGRES_PASSWORD:-hookforge}@postgres:5432/${POSTGRES_DB:-hookforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hookforge
    command: >
      celery -A app.workers.celery_app.celery_app beat
      --loglevel=INFO

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hookforge-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - hookforge
    command: npm run dev -- --host 0.0.0.0 --port 5173

networks:
  hookforge:
    driver: bridge
    name: hookforge-net

volumes:
  hookforge_pgdata:
    name: hookforge_pgdata
  hookforge_redisdata:
    name: hookforge_redisdata
  frontend_node_modules:
    name: hookforge_frontend_node_modules
