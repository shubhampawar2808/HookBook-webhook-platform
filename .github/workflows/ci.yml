name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Provision hookforge_test role and database
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -c "CREATE USER hookforge_app WITH PASSWORD 'ci_test_password';"
          psql -h localhost -U postgres -c "CREATE DATABASE hookforge_test OWNER hookforge_app;"
          psql -h localhost -U postgres -d hookforge_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d hookforge_test -c "GRANT ALL ON SCHEMA public TO hookforge_app;"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Pytest
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-16chars
          DATABASE_URL: postgresql+asyncpg://hookforge_app:ci_test_password@localhost:5432/hookforge_test
          TEST_DATABASE_URL: postgresql+asyncpg://hookforge_app:ci_test_password@localhost:5432/hookforge_test
          REDIS_URL: redis://localhost:6379/15
          CELERY_BROKER_URL: redis://localhost:6379/14
          CELERY_RESULT_BACKEND: redis://localhost:6379/13
          CORS_ORIGINS: http://localhost:5173
          REDIS_REQUIRED: "false"
          ALLOW_PUBLIC_REGISTRATION: "true"
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build
